<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사람인 댓글 카운터</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }
    h1 { font-size: 18px; font-weight: 600; color: #111; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
    .period-card {
      background: #f8f8f8;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .period-label { font-size: 11px; color: #aaa; margin-bottom: 3px; }
    .period-value { font-size: 15px; font-weight: 600; color: #111; }
    .period-right { text-align: right; }
    .today-txt { font-size: 11px; color: #aaa; }
    .remain-txt { font-size: 13px; font-weight: 600; color: #1a6ef5; margin-top: 2px; }
    .run-btn {
      width: 100%; padding: 14px;
      background: #111; color: #fff;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
      margin-bottom: 1.25rem;
    }
    .run-btn:hover { opacity: 0.82; }
    .run-btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .err-box {
      background: #fff5f5; border: 1px solid #fcc;
      border-radius: 10px; padding: 12px 16px;
      font-size: 13px; color: #c00;
      display: none; margin-bottom: 1rem; line-height: 1.6;
    }
    .profiles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .profile-card { border: 1px solid #eee; border-radius: 12px; overflow: hidden; }
    .profile-head { padding: 12px 14px; background: #f8f8f8; border-bottom: 1px solid #eee; }
    .profile-head .pid { font-size: 11px; color: #aaa; font-family: monospace; margin-bottom: 2px; }
    .profile-head .pname { font-size: 14px; font-weight: 600; color: #111; }
    .profile-body { padding: 16px 14px; }
    .big-count { font-size: 44px; font-weight: 700; line-height: 1; margin-bottom: 4px; color: #ccc; }
    .big-count.done { color: #1a6ef5; }
    .count-sub { font-size: 12px; color: #999; margin-bottom: 14px; }
    .mini-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .mini-label { font-size: 12px; color: #bbb; }
    .mini-val { font-size: 12px; font-weight: 600; color: #888; }
    .prog-wrap { height: 3px; background: #f0f0f0; border-radius: 2px; overflow: hidden; margin-top: 10px; }
    .prog-bar { height: 100%; background: #1a6ef5; border-radius: 2px; width: 0%; transition: width 0.5s; }
    .status-txt { font-size: 11px; color: #bbb; margin-top: 5px; min-height: 14px; }
    .updated-at { font-size: 11px; color: #bbb; text-align: center; margin-top: 1rem; }
  </style>
</head>
<body>
<div class="container">
  <h1>🗨 사람인 댓글 카운터</h1>
  <p class="subtitle">공백 포함 150자 이상 댓글 수를 현재 집계 기간 기준으로 조회합니다</p>

  <div class="period-card">
    <div>
      <div class="period-label">현재 집계 기간</div>
      <div class="period-value" id="period-text">—</div>
    </div>
    <div class="period-right">
      <div class="today-txt" id="today-text"></div>
      <div class="remain-txt" id="remain-text"></div>
    </div>
  </div>

  <button class="run-btn" id="run-btn" onclick="runAll()">▶ 프로필 동시 조회</button>

  <div class="err-box" id="err-box"></div>

  <div class="profiles-grid">
    <div class="profile-card">
      <div class="profile-head">
        <div class="pid">#20386702</div>
        <div class="pname">겨울에태어난아이</div>
      </div>
      <div class="profile-body">
        <div class="big-count" id="count-0">—</div>
        <div class="count-sub">150자 이상 · 기간 내</div>
        <div class="mini-row"><span class="mini-label">기간 내 전체</span><span class="mini-val" id="period-0">—</span></div>
        <div class="mini-row"><span class="mini-label">총 조회</span><span class="mini-val" id="total-0">—</span></div>
        <div class="prog-wrap"><div class="prog-bar" id="prog-0"></div></div>
        <div class="status-txt" id="status-0"></div>
      </div>
    </div>
    <div class="profile-card">
      <div class="profile-head">
        <div class="pid">#18704145</div>
        <div class="pname">실버레인</div>
      </div>
      <div class="profile-body">
        <div class="big-count" id="count-1">—</div>
        <div class="count-sub">150자 이상 · 기간 내</div>
        <div class="mini-row"><span class="mini-label">기간 내 전체</span><span class="mini-val" id="period-1">—</span></div>
        <div class="mini-row"><span class="mini-label">총 조회</span><span class="mini-val" id="total-1">—</span></div>
        <div class="prog-wrap"><div class="prog-bar" id="prog-1"></div></div>
        <div class="status-txt" id="status-1"></div>
      </div>
    </div>
    <div class="profile-card">
      <div class="profile-head">
        <div class="pid">#9098651</div>
        <div class="pname">홍니마토</div>
      </div>
      <div class="profile-body">
        <div class="big-count" id="count-2">—</div>
        <div class="count-sub">150자 이상 · 기간 내</div>
        <div class="mini-row"><span class="mini-label">기간 내 전체</span><span class="mini-val" id="period-2">—</span></div>
        <div class="mini-row"><span class="mini-label">총 조회</span><span class="mini-val" id="total-2">—</span></div>
        <div class="prog-wrap"><div class="prog-bar" id="prog-2"></div></div>
        <div class="status-txt" id="status-2"></div>
      </div>
    </div>
  </div>
  <div class="updated-at" id="updated-at"></div>
</div>

<script>
const PROFILES = [
  { id: '20386702', name: '겨울에태어난아이' },
  { id: '18704145', name: '실버레인' }
  { id: '9098651', name: '홍니마토' }
];

function getPeriod() {
  const now = new Date();
  const y = now.getFullYear(), mo = now.getMonth(), d = now.getDate();
  let start, end;
  if (d >= 15) {
    start = new Date(y, mo, 15, 0, 0, 0);
    end   = new Date(y, mo + 1, 14, 23, 59, 59);
  } else {
    start = new Date(y, mo - 1, 15, 0, 0, 0);
    end   = new Date(y, mo, 14, 23, 59, 59);
  }
  return { start, end };
}

function fmt(d) {
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function initDisplay() {
  const now = new Date();
  const { start, end } = getPeriod();
  document.getElementById('period-text').textContent = `${fmt(start)} ~ ${fmt(end)}`;
  document.getElementById('today-text').textContent = `오늘: ${fmt(now)}`;
  const days = Math.ceil((end - now) / 86400000);
  document.getElementById('remain-text').textContent = days > 0 ? `마감까지 ${days}일 남음` : '기간 마감';
}

function setStatus(i, pct, msg) {
  document.getElementById('prog-' + i).style.width = pct + '%';
  document.getElementById('status-' + i).textContent = msg;
}

async function fetchProfile(i) {
  const { id } = PROFILES[i];
  const { start, end } = getPeriod();

  setStatus(i, 20, 'API 호출 중...');
  const res = await fetch(`/api/comments?userId=${id}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);

  setStatus(i, 60, '데이터 분석 중...');
  const data = await res.json();

  if (data.code !== 200 || !data.body || !data.body.content) {
    throw new Error(data.error || 'API 응답 오류');
  }

  const content = data.body.content;
  const inPeriod = content.filter(item => {
    const d = new Date(item.regDtm);
    return d >= start && d <= end;
  });
  const passing = inPeriod.filter(item => item.contCnnt && item.contCnnt.length >= 150);

  setStatus(i, 100, '완료');
  return { pass: passing.length, period: inPeriod.length, total: content.length };
}

async function runAll() {
  document.getElementById('err-box').style.display = 'none';
  document.getElementById('updated-at').textContent = '';
  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  btn.textContent = '⏳ 조회 중...';

  for (let i = 0; i < 2; i++) {
    const el = document.getElementById('count-' + i);
    el.textContent = '...'; el.className = 'big-count';
    document.getElementById('period-' + i).textContent = '—';
    document.getElementById('total-' + i).textContent = '—';
    setStatus(i, 5, '대기 중...');
  }

  const results = await Promise.allSettled([fetchProfile(0), fetchProfile(1)]);

  results.forEach((res, i) => {
    const el = document.getElementById('count-' + i);
    if (res.status === 'fulfilled') {
      const { pass, period, total } = res.value;
      el.textContent = pass;
      el.className = 'big-count done';
      document.getElementById('period-' + i).textContent = period + '개';
      document.getElementById('total-' + i).textContent = total + '개';
    } else {
      el.textContent = '오류';
      setStatus(i, 0, res.reason?.message || '조회 실패');
      document.getElementById('err-box').textContent = '조회 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
      document.getElementById('err-box').style.display = 'block';
    }
  });

  const now = new Date();
  document.getElementById('updated-at').textContent =
    `마지막 조회: ${fmt(now)} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  btn.disabled = false;
  btn.textContent = '↺ 다시 조회';
}

initDisplay();
</script>
</body>
</html>
